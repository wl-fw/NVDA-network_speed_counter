name: Build NVDA Add-on

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on tags like v2025.3.1
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar pacotes necessários
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext scons zip

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências do Python
        run: |
          python -m pip install --upgrade pip  # Ensure latest pip
          python -m pip install markdown       # Install markdown in the correct Python environment

      - name: Construir o complemento
        run: |
          python -m scons  # Use Python 3.11 to run scons, ensuring markdown is available

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: "*.nvda-addon"  # Matches the root directory output

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')  # Only for tags
        with:
          files: "*.nvda-addon"  # Matches the root directory output
          name: Release ${{ github.ref_name }}  # e.g., Release v2025.3.1
          tag_name: ${{ github.ref_name }}  # e.g., v2025.3.1
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}