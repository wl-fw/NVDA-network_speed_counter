name: Build NVDA Add-on

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on tags like v2025.3.1
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar pacotes necessários
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext scons zip

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências do Python
        run: pip install markdown

      - name: Construir o complemento
        run: scons  # Just 'scons' since there's no 'dist' target

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: "*.nvda-addon"  # Matches the root directory output

      - name: Criar Release no GitHub
        uses: softprops/action-gh