name: Build and Release NVDA Add-on

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install scons
        sudo apt-get update
        sudo apt-get install -y gettext

    - name: Build add-on
      run: scons

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: net_speed_counter
        path: '*.nvda-addon'

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: '*.nvda-addon'
        name: Release ${{ github.ref_name }}
        body: |
          Novo release do net_speed_counter: ${{ github.ref_name }}
          Veja o changelog em readme.md.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}